# Сборка и публикация TIME LAB на GitHub Pages при каждом push в main.
# Настройки берутся из Settings → Secrets and variables → Actions → Variables:
#   SUPABASE_URL, SUPABASE_ANON_KEY (публичный ключ), GOOGLE_AUTH (true/false), SITE_URL (необязательно)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_AUTH: ${{ vars.GOOGLE_AUTH || 'false' }}
          SITE_URL: ${{ vars.SITE_URL }}
          # project pages: https://<user>.github.io/<repo>/ ; для репозитория <user>.github.io base path — /
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
        run: bash scripts/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
